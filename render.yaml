services:
  - type: web
    name: compivox-app
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /api/health
    disk:
      name: compivox-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://compivox.xyz
      - key: DATABASE_PATH
        value: /var/data/compivox.db
      - key: IP_TRUST
        value: render
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: EDGE_PROXY_SECRET
        sync: false
      - key: IP_INTELLIGENCE_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_USERS
        sync: false

services:
  - type: web
    name: compivox-app
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /api/health
    disk:
      name: compivox-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://compivox.xyz
      - key: DATABASE_PATH
        value: /var/data/compivox.db
      - key: IP_TRUST
        value: render
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: CLOUDFLARE_TURNSTILE_SITE_KEY
        sync: false
      - key: CLOUDFLARE_TURNSTILE_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: IP_INTELLIGENCE_API_KEY
        sync: false
      - key: POLAR_ACCESS_TOKEN
        sync: false
      - key: POLAR_PRODUCT_ID_PRO
        sync: false
      - key: POLAR_SERVER
        value: production
      - key: ADMIN_EMAILS
        sync: false
